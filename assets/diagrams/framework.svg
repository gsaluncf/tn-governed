<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="370" viewBox="0 0 1080 370" role="img" aria-labelledby="title desc">
<title id="title">Governed data across data services, tools, and LLMs</title>
<desc id="desc">Data, tool, and LLM endpoints exchange encrypted, signed TN publications. Each endpoint configures its own keys, authorities, policy evaluator, and required-action handlers. Publications retain source policies, attributed claims, derivation links, and signed evidence.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4b6475"/></marker></defs>
<rect width="1080" height="370" rx="12" fill="#fff"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#172c3e">
<text x="28" y="36" font-size="19">Independently configured endpoints</text>
<g fill="#f1f6fa" stroke="#b5c8d5" stroke-width="1.5">
<rect x="28" y="63" width="290" height="152" rx="8"/>
<rect x="395" y="63" width="290" height="152" rx="8"/>
<rect x="762" y="63" width="290" height="152" rx="8"/>
</g>
