<text x="540" y="192">Authorize use and required actions</text>
<text x="907" y="192">Authorize use and required actions</text>
</g>
</g>
<g stroke="#4b6475" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)">
<line x1="330" y1="135" x2="383" y2="135"/>
<line x1="697" y1="135" x2="750" y2="135"/>
